<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 1 — Your first API</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">FastAPI turns type hints into validation, JSON and interactive docs</text><rect x="30" y="200" width="140" height="64" rx="32.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="100.0" y="228.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">You / browser</text><text x="100.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">curl, /docs</text><rect x="240" y="170" width="230" height="124" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="355.0" y="210.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">FastAPI app</text><text x="355.0" y="228.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">GET /products</text><text x="355.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">GET /products/{id}</text><text x="355.0" y="264.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">POST /products</text><rect x="560" y="110" width="360" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="740.0" y="141.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Pydantic model ProductIn</text><text x="740.0" y="159.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">sku pattern, price &gt; 0, stock &gt;= 0</text><rect x="560" y="290" width="360" height="70" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="740.0" y="321.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">PRODUCTS (a Python dict)</text><text x="740.0" y="339.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">in memory: gone on restart</text><path d="M170.0,232.0 L240.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="163.7" y="220.0" width="82.6" height="16" fill="#fff" opacity="0.92"/><text x="205.0" y="232.0" font-size="12" fill="#71717a" text-anchor="middle">HTTP + JSON</text><path d="M470.0,206.0 L585.1,180.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="496.2" y="181.0" width="62.8" height="16" fill="#fff" opacity="0.92"/><text x="527.6" y="193.0" font-size="12" fill="#71717a" text-anchor="middle">validate</text><path d="M470.0,259.8 L595.1,290.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="488.0" y="262.9" width="89.2" height="16" fill="#fff" opacity="0.92"/><text x="532.6" y="274.9" font-size="12" fill="#71717a" text-anchor="middle">read / write</text><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">Measured: first request 18 ms; 200 requests p50 2.2 ms, p99 4.0 ms.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">An invalid product got 422 naming every bad field; a duplicate SKU got 409.</text></svg>