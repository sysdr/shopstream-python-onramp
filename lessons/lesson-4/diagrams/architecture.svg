<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 4 — Tests at two levels</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">Fast unit tests for pricing, API tests against a throwaway Postgres database</text><rect x="40" y="180" width="200" height="100" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="140.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">pytest</text><text x="140.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">+ coverage</text><rect x="330" y="100" width="280" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="470.0" y="131.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">unit: app/pricing.py</text><text x="470.0" y="149.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">pure function, milliseconds</text><rect x="330" y="290" width="280" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="470.0" y="321.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">API: TestClient</text><text x="470.0" y="339.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">orders, quotes, concurrency</text><path d="M700,280 v90 a110.0,10 0 0 0 220,0 v-90" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="810.0" cy="280" rx="110.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="810.0" y="318.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Postgres</text><text x="810.0" y="336.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">shopstream_test</text><text x="810.0" y="354.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">created per run</text><path d="M240.0,201.2 L348.4,170.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M240.0,258.8 L348.4,290.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M610.0,325.0 L700.0,325.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">17 tests pass, coverage 89%; the buggy pricing module fails 2 of them.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Across 19,900 prices: 8 wrong totals with no code, 464 with SAVE10, 2,407 with FLAT5.</text></svg>