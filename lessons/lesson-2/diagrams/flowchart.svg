="35.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="810.0" y="151.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">0 rows</text><text x="810.0" y="169.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">searched for that text</text><rect x="700" y="330" width="220" height="70" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="810.0" y="361.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">every row</text><text x="810.0" y="379.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">the WHERE became true</text><path d="M247.2,230.0 L368.7,190.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="260.0" y="198.0" width="95.8" height="16" fill="#fff" opacity="0.92"/><text x="307.9" y="210.0" font-size="12" fill="#71717a" text-anchor="middle">parameterised</text><path d="M251.0,294.0 L364.6,330.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="263.2" y="300.0" width="89.2" height="16" fill="#fff" opacity="0.92"/><text x="307.8" y="312.0" font-size="12" fill="#71717a" text-anchor="middle">string-built</text><path d="M620.0,155.0 L700.0,155.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M620.0,365.0 L700.0,365.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/></svg>