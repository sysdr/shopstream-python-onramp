181b" text-anchor="middle">gunicorn</text><text x="550.0" y="226.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">2 uvicorn workers</text><text x="550.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">JSON access log</text><text x="550.0" y="262.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">user shop</text><path d="M720,190 v80 a100.0,10 0 0 0 200,0 v-80" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="820.0" cy="190" rx="100.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="820.0" y="223.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Postgres</text><text x="820.0" y="241.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">password from .env</text><text x="820.0" y="259.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">volume pgdata</text><path d="M150.0,232.0 L250.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="152.1" y="204.0" width="95.8" height="16" fill="#fff" opacity="0.92"/><text x="200.0" y="216.0" font-size="12" fill="#71717a" text-anchor="middle">trycloudflare</text><path d="M400.0,231.3 L440.0,231.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M660.0,230.0 L720.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">2 gunicorn workers, readiness check, secrets from .env, demo endpoints 404.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Through the public tunnel: p50 204 ms vs 3.9 ms locally; a restart kept every order.</text></svg>