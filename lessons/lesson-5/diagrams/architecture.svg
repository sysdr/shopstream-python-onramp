" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="450.0" y="336.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">dev (tests, tools)</text><text x="450.0" y="354.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">runtime + pytest</text><path d="M680,200 v80 a120.0,10 0 0 0 240,0 v-80" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="800.0" cy="200" rx="120.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="800.0" y="233.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">compose</text><text x="800.0" y="251.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">api: runtime</text><text x="800.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">tools: dev</text><path d="M240.0,217.4 L320.0,199.4" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="238.7" y="196.4" width="82.6" height="16" fill="#fff" opacity="0.92"/><text x="280.0" y="208.4" font-size="12" fill="#71717a" text-anchor="middle">COPY --from</text><path d="M450.0,220.0 L450.0,300.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="405.4" y="248.0" width="89.2" height="16" fill="#fff" opacity="0.92"/><text x="450.0" y="260.0" font-size="12" fill="#71717a" text-anchor="middle">FROM runtime</text><path d="M580.0,196.0 L680.0,216.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M580.0,302.9 L680.0,274.3" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">Naive image 1,694 MB as root; runtime stage 236 MB as user shop, health check green.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Missing DATABASE_URL or a localhost URL now fails in one clear line.</text></svg>