<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 3 — Orders without overselling</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">The stock check and the stock change happen in one SQL statement</text><rect x="30" y="180" width="150" height="100" rx="50.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="105.0" y="217.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">50 buyers</text><text x="105.0" y="235.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">at the same</text><text x="105.0" y="253.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">moment</text><rect x="240" y="180" width="200" height="100" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="340.0" y="217.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">POST /orders</text><text x="340.0" y="235.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">one transaction</text><text x="340.0" y="253.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">per order</text><rect x="510" y="110" width="410" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="715.0" y="141.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">UPDATE products SET stock = stock - 1</text><text x="715.0" y="159.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">WHERE sku = %s AND stock &gt;= 1 RETURNING stock</text><rect x="510" y="290" width="410" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="715.0" y="321.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">INSERT INTO orders ...</text><text x="715.0" y="339.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">only if the UPDATE returned a row</text><path d="M180.0,230.0 L240.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M440.0,207.3 L560.6,180.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M440.0,255.3 L576.8,290.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">50 buyers, 10 in stock: naive accepted 50 (40 oversold, stock column said 6 left).</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Atomic UPDATE: exactly 10 accepted, 40 rejected with 409, 0 oversold.</text></svg>