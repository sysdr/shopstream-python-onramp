" stroke-width="1.5"/><text x="610.0" y="308.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">rejected 409</text><text x="610.0" y="326.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">nothing written</text><path d="M200.0,232.0 L260.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="205.2" y="220.0" width="49.6" height="16" fill="#fff" opacity="0.92"/><text x="230.0" y="232.0" font-size="12" fill="#71717a" text-anchor="middle">UPDATE</text><path d="M440.0,207.8 L520.0,186.2" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="435.4" y="185.0" width="89.2" height="16" fill="#fff" opacity="0.92"/><text x="480.0" y="197.0" font-size="12" fill="#71717a" text-anchor="middle">stock &gt;= qty</text><path d="M440.0,259.7 L520.0,284.3" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="438.7" y="260.0" width="82.6" height="16" fill="#fff" opacity="0.92"/><text x="480.0" y="272.0" font-size="12" fill="#71717a" text-anchor="middle">stock &lt; qty</text><text x="40" y="400" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The stock change and the order row commit together or not at all.</text></svg>