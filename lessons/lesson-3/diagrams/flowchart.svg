<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 3 — Two buyers, one item: the race</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="100" width="260" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="170.0" y="133.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">A: SELECT stock -&gt; 1</text><rect x="380" y="150" width="260" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="510.0" y="183.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">B: SELECT stock -&gt; 1</text><rect x="40" y="240" width="260" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="170.0" y="273.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">A: UPDATE stock = 0</text><rect x="380" y="290" width="260" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="510.0" y="323.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">B: UPDATE stock = 0</text><rect x="690" y="190" width="230" height="70" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="805.0" y="221.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">2 orders, 1 item</text><text x="805.0" y="239.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">oversold by 1</text><path d="M170.0,156.0 L170.0,240.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M510.0,206.0 L510.0,290.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M300.0,259.2 L690.0,232.8" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M598.8,290.0 L694.0,260.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="420" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Both read before either wrote. With one atomic UPDATE, B waits for A's row lock, then sees stock 0.</text></svg>